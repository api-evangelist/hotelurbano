name: HotelUrbano
description: >-
  HotelUrbano (later rebranded Hurb) was a Brazilian online travel agency
  founded in January 2011 by Joao Ricardo Mendes and headquartered in Rio de
  Janeiro, offering hotel bookings, flights, and flexible travel packages across
  domestic and international destinations. Once one of Brazil's largest OTAs and
  backed by investors including Insight Partners and Tiger Global, the company
  collapsed amid consumer-protection complaints: the Brazilian Ministry of
  Tourism revoked its Cadastur operating license on 14 April 2025 and the
  company ceased all operations on 25 October 2025. Its consumer domains
  (hotelurbano.com.br, hurb.com) no longer resolve and it publishes no public
  API, developer portal, SDKs, or OpenAPI. The only surviving public technical
  surface is its GitHub organization (hurbcom), which hosts engineering coding
  challenges and open-source utility forks rather than product APIs. This
  profile is retained as a historical/defunct-company record in the API
  Evangelist network.
